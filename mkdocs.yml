site_name: Automated Rating Curve (ARC)
site_description: Documentation for the Automated Rating Curve (ARC) generator.
repo_url: https://github.com/MikeFHS/automated-rating-curve
repo_name: MikeFHS/automated-rating-curve

theme:
  name: material
  features:
    - content.code.copy
    - content.tabs.link
    - navigation.sections
    - navigation.footer

docs_dir: docs
site_dir: site
exclude_docs: |
  figures/

markdown_extensions:
  - admonition
  - toc:
      permalink: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.details
  - pymdownx.snippets:
      base_path: .
  - pymdownx.arithmatex:
      generic: true

extra_javascript:
  - javascripts/katex.js
  - https://unpkg.com/katex@0/dist/katex.min.js
  - https://unpkg.com/katex@0/dist/contrib/auto-render.min.js

extra_css:
  - https://unpkg.com/katex@0/dist/katex.min.css
  - stylesheets/api.css

nav:
  - Home: index.md
  - Installation: installation.md
  - Overview:
    - Getting Started: getting_started.md
    - Model Input File: model_input_file.md
    - Outputs: outputs.md
    - Limitations: limitations.md
    - API: api.md
  - Technical Details:
    - Key Concepts: miscellaneous.md
    - Bathymetry: bathymetry.md
    - Stream Slope Methods: stream_slope_methods.md
    - Standard Step: standard_step.md
    - Valley Cross Sections: valley_sections.md
    - Running the Tests: testing_unit_tests.md
  - Examples:
    - Produce Streamflow Inputs: produce_streamflow_inputs.md
    - Produce Geospatial Inputs: produce_geospatial_inputs.md
    - Running ARC: running_arc.md
    - Making Inputs for FIST: making_inputs_for_fist.md
    - Neuse River Flooding: neuse_river_flooding.md
    - Representative Cross Section: representative_cross_section.md
  - License: license.md

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            filters:
              - "!^_"
            heading_level: 3
            show_signature: true
            # The parameter tables give the types, so the signatures leave them out
            show_signature_annotations: false
            # Each signature in its own code block, one parameter a line (formatted by ruff)
            separate_signature: true
            line_length: 80
            signature_crossrefs: true
            docstring_style: numpy
            docstring_section_style: spacy
            show_source: false
            show_root_heading: true
            show_root_full_path: false
            show_symbol_type_heading: true
            show_symbol_type_toc: true
            show_labels: false
            merge_init_into_class: true
            members_order: source
            annotations_path: brief
            # Configs' fields have no docstrings: Model Input File describes them
            show_if_no_docstring: false
